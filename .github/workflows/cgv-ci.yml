name: CGV CI

# Deterministic evidence for the contract graph verifier (requirements CI-1 to
# CI-8 in intent/2026-09-29-deterministic-evidence-spec.md). No LLM, no secrets.

on:
  pull_request:
    paths: ["cgv/**", ".github/workflows/cgv-ci.yml", ".claude/rules/protected-surfaces.md"]
  push:
    branches: [main]
    paths: ["cgv/**", ".github/workflows/cgv-ci.yml", ".claude/rules/protected-surfaces.md"]

permissions:
  contents: read

jobs:
  cgv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cgv
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo and the Lean build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.elan
            cgv/target
            cgv/prover/.lake
          key: cgv-${{ runner.os }}-${{ hashFiles('cgv/Cargo.lock', 'cgv/prover/lean-toolchain', 'cgv/prover/lake-manifest.json') }}
          restore-keys: cgv-${{ runner.os }}-

      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$(cat prover/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: "Lean proofs, checker and #guard tests"
        working-directory: cgv/prover
        run: lake build

      # After lake build: tests/e2e_text_format.rs runs the checker binary lake
      # builds, and skips when it is missing.
      - name: Rust tests
        run: cargo test

      - name: Rust release build
        run: cargo build --release

      - name: Fixtures (extractor + checker against expected.json)
        run: scripts/check-fixtures.sh

      - name: Protected theorem statements match the committed manifest, using only standard axioms
        working-directory: cgv/prover
        run: |
          lake build ContractGraph ContractGraph.Main
          lake env lean --run scripts/ProtectedStatements.lean > "$RUNNER_TEMP/protected-statements.txt"
          if ! diff -u protected-statements.txt "$RUNNER_TEMP/protected-statements.txt"; then
            echo "::error::A protected CGV statement changed. If intended, regenerate cgv/prover/protected-statements.txt (see its header), which makes this a Tier 3 change needing a governance note and a 'Protected-surface change' section in the PR body."
            exit 1
          fi

      # CI-8 in intent/2026-09-29-deterministic-evidence-spec.md: fails if this
      # toolchain's leanchecker stops rejecting a declaration that skipped the kernel.
      - name: The kernel replay rejects a declaration that skipped the kernel
        working-directory: cgv/prover
        run: |
          bin="$(lean --print-prefix)/bin"
          export PATH="$bin:$PATH"
          scratch="$(mktemp -d)"
          cd "$scratch"
          cat > KernelReplayBad.lean <<'LEAN'
          import Lean
          open Lean in
          set_option debug.skipKernelTC true in
          run_meta addDecl (.thmDecl { name := `bad, levelParams := [], type := mkConst ``False, value := mkConst ``True.intro })
          theorem uses : 1 = 2 := (bad).elim
          LEAN
          printf 'import KernelReplayBad\ntheorem top : 1 = 2 := uses\n' > KernelReplayTop.lean
          export LEAN_PATH="$scratch"
          lean KernelReplayBad.lean -o KernelReplayBad.olean
          lean KernelReplayTop.lean -o KernelReplayTop.olean
          expect_rejected() {
            if out=$(leanchecker "$@" 2>&1); then
              echo "::error::leanchecker $* accepted a theorem of False that skipped the kernel."
              exit 1
            fi
            if ! grep -q "declaration type mismatch, 'bad'" <<<"$out"; then
              echo "$out"
              echo "::error::leanchecker $* failed, but not on the declaration that skipped the kernel."
              exit 1
            fi
          }
          expect_rejected KernelReplayBad
          expect_rejected --fresh KernelReplayTop

      # CI-7: replays the built environment through the kernel. The fresh replay
      # covers ContractGraph.Main's import closure, which holds every protected
      # theorem; the second command covers every ContractGraph.* module.
      - name: The built ContractGraph environment re-checks in the Lean kernel (limits in CI-9)
        working-directory: cgv/prover
        run: |
          lake env leanchecker --fresh ContractGraph.Main
          lake env leanchecker ContractGraph

      # SM-10 in intent/2026-10-07-manifest-reach-spec.md: fails if the
      # generator stops checking the rules table, or the manifest stops
      # recording what the protected statements reach.
      - name: The manifest generator checks the rules table and hashes what the statements reach
        working-directory: cgv/prover
        run: scripts/manifest-selftest.sh
