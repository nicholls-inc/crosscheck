name: CI

on:
  push:
    branches: ["main", "phase1-go-mvp"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    name: Test and contract verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download dependencies
        # Regenerate go.sum in CI to avoid hand-crafted checksum drift.
        run: |
          rm -f go.sum
          go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Build CGV binary
        run: go build -o cgv ./cmd/cgv

      - name: Verify crosscheck contract graph
        run: go run ./cmd/cgv verify --graph crosscheck-cgv.yaml

  dafny-syntax:
    name: Dafny spec syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.6.0"

      - name: Verify CGVCore.dfy (syntax + proof)
        run: dafny verify specs/CGVCore.dfy
